name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: |
        unzip -o TPMS_Project.zip

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        build-root-directory: TPMS_Project

    - name: Build Debug APK
      working-directory: ./TPMS_Project
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TPMS-App
        path: TPMS_Project/app/build/outputs/apk/debug/app-debug.apk
