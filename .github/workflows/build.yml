name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip project file
      run: |
        # Giải nén chính xác file TPMS_Project.zip
        unzip -o TPMS_Project.zip
        
        # Chuyển tất cả file ra thư mục gốc nếu bị nằm trong thư mục con
        if [ -d "TPMS_Project" ]; then
          cp -r TPMS_Project/* . || true
          cp -r TPMS_Project/.* . || true
        fi
        
        # Phân quyền chạy cho gradlew
        chmod +x gradlew || true

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: TPMS-App
        path: app/build/outputs/apk/debug/app-debug.apk
